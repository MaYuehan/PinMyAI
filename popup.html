<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ChatPin</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info {
      font-size: 14px;
      color: #666;
      line-height: 1.4;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background: #10a37f;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h2>📌 PinMyAI</h2>
  <div class="info">
    To use PinMyAI, open <b>ChatGPT</b>, <b>Claude</b>, or <b>DeepSeek</b>. 
    Select any text in an AI's reply to create a pin.
  </div>
  <a href="https://chatgpt.com" target="_blank" class="btn">Go to ChatGPT</a>
</body>
</html>
