<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ChatPin</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --text-sec: #666666;
      --accent: #007aff;
      --border: rgba(0, 0, 0, 0.08);
      --font: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro', 'Segoe UI', sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --text: #f5f5f7;
        --text-sec: #a1a1a6;
        --border: rgba(255, 255, 255, 0.1);
      }
    }
    body {
      width: 280px;
      padding: 20px;
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .info {
      font-size: 0.9rem;
      color: var(--text-sec);
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <h2>📌 ChatPin</h2>
  <div class="info">
    To use <b>ChatPin</b>, open ChatGPT, Claude, or DeepSeek. Select any text in an AI's reply to create a pin.
  </div>
  <a href="https://chatgpt.com" target="_blank" class="btn">Go to ChatGPT</a>
</body>
</html>
