<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PinMyAI</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-subtle: #f9f9f9;
      --text: #1a1a1a;
      --text-sec: #6b6b6b;
      --accent: #2d6a4f;
      --border: #e6e6e6;
      --font: "Claude Variable", "Claude", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #2a2a2a;
        --bg-subtle: #1e1e1e;
        --text: #e5e5e5;
        --text-sec: #a0a0a0;
        --border: #3a3a3a;
      }
    }
    body {
      width: 280px;
      padding: 24px;
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .info {
      font-size: 14px;
      color: var(--text-sec);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      font-size: 14px;
      transition: opacity 150ms ease-out;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h2>📌 PinMyAI</h2>
  <div class="info">
    Pin and jump to specific messages in AI conversations. Select any text to create a pin.
  </div>
  <a href="https://claude.ai" target="_blank" class="btn">Go to Claude</a>
</body>
</html>
